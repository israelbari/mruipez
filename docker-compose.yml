services:
  db:
    image: mysql:8.0
    container_name: mruipez-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mruipez_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mruipez}
      MYSQL_USER: ${MYSQL_USER:-mruipez}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mruipez_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mruipez_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mruipez-network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Vite embeds these at BUILD time — must be passed during image build
        VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL:-https://auth.kimi.com}
        VITE_APP_ID: ${VITE_APP_ID:-}
    container_name: mruipez-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      # Full connection string for Drizzle ORM
      DATABASE_URL: mysql://${MYSQL_USER:-mruipez}:${MYSQL_PASSWORD:-mruipez_pass}@db:3306/${MYSQL_DATABASE:-mruipez}
      # Auth credentials (REQUIRED — fill in .env)
      APP_SECRET: ${APP_SECRET:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      # Frontend vars (also passed at runtime for consistency)
      VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL:-https://auth.kimi.com}
      VITE_APP_ID: ${VITE_APP_ID:-}
    ports:
      - "${APP_PORT:-3005}:3000"
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - mruipez-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  mruipez-network:
    driver: bridge
